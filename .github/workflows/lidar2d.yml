name: Independent lidar2d laboratory
on:
  push:
    paths: ["labs/lidar2d/**", ".github/workflows/lidar2d.yml"]
  pull_request:
    paths: ["labs/lidar2d/**", ".github/workflows/lidar2d.yml"]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "labs/lidar2d[test]"
      - run: python -m pytest labs/lidar2d/tests -q
      - run: python -m cocommand2d simulate --headless --demo --steps 300 --record output/demo/scans.jsonl --output output/demo
      - run: python -m cocommand2d replay --headless --file output/demo/scans.jsonl --output output/replay
  sdk-build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official SDK before configuration
        uses: actions/checkout@v4
        with:
          repository: Slamtec/rplidar_sdk
          ref: 99478e5fb90de3b4a6db0080acacd373f8b36869
          path: .external/rplidar_sdk
      - run: cmake -S labs/lidar2d/native -B build-c1 -DRPLIDAR_SDK_ROOT=${{ github.workspace }}/.external/rplidar_sdk
      - run: cmake --build build-c1 --config Release --parallel 2
