[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocommand-lidar2d"
version = "0.1.0"
description = "Independent 2D lidar SLAM and manual vessel laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pygame-ce>=2.5,<3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cocommand2d = "cocommand2d.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
